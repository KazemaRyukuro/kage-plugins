version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    labels: ["dependencies", "type: chore"]
    commit-message:
      prefix: Abhängigkeiten
    groups:
      pruefung:
        patterns: ["ajv", "ajv-formats"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    labels: ["dependencies", "type: chore"]
    commit-message:
      prefix: Abhängigkeiten
